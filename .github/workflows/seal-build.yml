name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml, JDK 7/8/9/10/11 legs).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Package jars (JDK 7, as the public 0.10.8 release was built)
        env:
          MAVEN_OPTS: -Dhttps.protocols=TLSv1.2 -Xmx512m -XX:MaxPermSize=128m
        run: |
          java -version
          ./mvnw -B --no-transfer-progress package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: jjwt-impl-jar
          path: impl/target/jjwt-impl-0.10.8.jar
          if-no-files-found: error
